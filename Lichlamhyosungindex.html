Lịch làm hyosung
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Đi Làm Hyosung</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 15px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #0056b3; margin-bottom: 15px; font-size: 20px; }
        .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; background: #eef2f7; padding: 12px; border-radius: 8px; }
        .control-group { display: flex; justify-content: space-between; align-items: center; }
        label { font-weight: bold; font-size: 14px; }
        select, button { padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
        select { background: white; }
        button { background: #0056b3; color: white; border: none; font-weight: bold; }
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .day-header { font-weight: bold; background: #0056b3; color: white; padding: 6px 0; border-radius: 4px; font-size: 12px; }
        .day-cell { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; min-height: 60px; padding: 4px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
        .day-cell.empty { background: transparent; border: none; }
        .day-number { font-size: 12px; font-weight: bold; }
        .shift-badge { width: 100%; padding: 3px 0; border-radius: 3px; font-size: 10px; font-weight: bold; color: white; }
        .shift-ca1 { background-color: #28a745; }
        .shift-ca2 { background-color: #ffc107; color: #333; }
        .shift-ca3 { background-color: #dc3545; }
        .shift-nghi { background-color: #6c757d; }
        .today { border: 2px solid #0056b3; background-color: #e8f0fe; }
        .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; font-size: 12px; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-color { width: 14px; height: 14px; border-radius: 3px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Lịch Đi Làm Hyosung</h1>
    <div class="controls">
        <div class="control-group">
            <label for="kipSelect">Chọn Kíp:</label>
            <select id="kipSelect" onchange="renderCalendar()">
                <option value="1">Kíp 1</option>
                <option value="2">Kíp 2</option>
                <option value="3">Kíp 3</option>
                <option value="4">Kíp 4</option>
            </select>
        </div>
        <div class="control-group">
            <button onclick="changeMonth(-1)">&lt; Tháng trước</button>
            <span id="monthYearLabel" style="font-weight: bold;"></span>
            <button onclick="changeMonth(1)">Tháng sau &gt;</button>
        </div>
    </div>
    <div class="calendar" id="calendar"></div>
    <div class="legend">
        <div class="legend-item"><div class="legend-color shift-ca1"></div> Ca 1 (06:00-14:00)</div>
        <div class="legend-item"><div class="legend-color shift-ca2"></div> Ca 2 (14:00-22:00)</div>
        <div class="legend-item"><div class="legend-color shift-ca3"></div> Ca 3 (22:00-06:00)</div>
        <div class="legend-item"><div class="legend-color shift-nghi"></div> Nghỉ</div>
    </div>
</div>
<script>
    const anchorDate = new Date(2026, 0, 1);
    const shiftCycle = ["Ca 1", "Ca 1", "Ca 2", "Ca 2", "Ca 3", "Ca 3", "Nghỉ", "Nghỉ"];
    const kipOffsets = { 1: 0, 2: 2, 3: 4, 4: 6 };
    let currentDate = new Date();

    function getShift(date, kip) {
        const diffTime = Math.floor((date - anchorDate) / (1000 * 60 * 60 * 24));
        let cycleIndex = (diffTime + kipOffsets[kip]) % 8;
        if (cycleIndex < 0) cycleIndex += 8;
        return shiftCycle[cycleIndex];
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const selectedKip = parseInt(document.getElementById('kipSelect').value);
        document.getElementById('monthYearLabel').innerText = `Tháng ${month + 1} / ${year}`;
        const calendarEl = document.getElementById('calendar');
        calendarEl.innerHTML = '';
        const weekDays = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
        weekDays.forEach(day => {
            const header = document.createElement('div');
            header.className = 'day-header';
            header.innerText = day;
            calendarEl.appendChild(header);
        });
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        for (let i = 0; i < firstDay; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'day-cell empty';
            calendarEl.appendChild(emptyCell);
        }
        const today = new Date();
        for (let day = 1; day <= daysInMonth; day++) {
            const dateObj = new Date(year, month, day);
            const shift = getShift(dateObj, selectedKip);
            const dayCell = document.createElement('div');
            dayCell.className = 'day-cell';
            if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                dayCell.classList.add('today');
            }
            const dayNumber = document.createElement('div');
            dayNumber.className = 'day-number';
            dayNumber.innerText = day;
            const shiftBadge = document.createElement('div');
            shiftBadge.className = 'shift-badge';
            shiftBadge.innerText = shift;
            if (shift === 'Ca 1') shiftBadge.classList.add('shift-ca1');
            else if (shift === 'Ca 2') shiftBadge.classList.add('shift-ca2');
            else if (shift === 'Ca 3') shiftBadge.classList.add('shift-ca3');
            else shiftBadge.classList.add('shift-nghi');
            dayCell.appendChild(dayNumber);
            dayCell.appendChild(shiftBadge);
            calendarEl.appendChild(dayCell);
        }
    }
    function changeMonth(delta) { currentDate.setMonth(currentDate.getMonth() + delta); renderCalendar(); }
    renderCalendar();
</script>
</body>
</html>
